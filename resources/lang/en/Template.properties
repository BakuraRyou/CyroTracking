consentCyroAnalyticsLabel = "Google Analytics"
consentCyroAnalyticsDescription = "Allows statistics tracking with Google Analytics 4 for page views, product events, cart, checkout, search and purchases. Cookies: _ga, _ga_*, _gid, _gat, _gcl_au. Campaign parameters may be stored locally for up to 30 minutes to attribute later events in the same session. Data such as page URL, referrer, campaign parameters, device information and shop events may be transferred to Google."
consentCyroAnalyticsProvider = "Google Ireland Limited"
consentCyroAnalyticsLifespan = "Up to 2 years / according to Google settings"
consentCyroAnalyticsPolicyUrl = "https://policies.google.com/privacy"
consentCyroMatomoLabel = "Matomo Analytics"
consentCyroMatomoDescription = "Allows statistics tracking with Matomo for page views, product events, cart, checkout, search and purchases. Cookies: _pk_id, _pk_ses, _pk_ref, _pk_cvar and possible Matomo consent cookies. Campaign parameters may be processed for visit and conversion attribution."
consentCyroMatomoProvider = "Cyroline"
consentCyroMatomoLifespan = "Up to 13 months / according to Matomo settings"
consentCyroMatomoPolicyUrl = "https://matomo.org/privacy-policy/"
consentCyroMarketingLabel = "Meta Pixel and Meta Conversions API"
consentCyroMarketingDescription = "Allows marketing and conversion tracking with Meta Pixel and server-side Meta Conversions API for page views, products, cart, checkout, search and purchases. Cookies: _fbp, _fbc. Campaign parameters may be stored locally for up to 30 minutes to attribute later events in the same session. Data such as page URL, referrer, campaign parameters, IP address, user agent, event ID, shop events and, during checkout and purchase, hashed customer identifiers such as email address, phone number, first name, last name or customer ID may be transferred to Meta."
consentCyroMarketingProvider = "Meta Platforms Ireland Limited"
consentCyroMarketingLifespan = "Up to 3 months / according to Meta settings"
consentCyroMarketingPolicyUrl = "https://www.facebook.com/privacy/policy/"

consentCyroAnalyticsLabel = "Google Analytics"
consentCyroAnalyticsDescription = "Erlaubt Statistik-Tracking mit Google Analytics 4 fuer Seitenaufrufe, Produktereignisse, Warenkorb, Checkout, Suche und Kaeufe. Cookies: _ga, _ga_*, _gid, _gat, _gcl_au. Kampagnenparameter koennen lokal bis zu 30 Minuten gespeichert werden, um Folgeereignisse derselben Sitzung zuzuordnen. Es koennen Daten wie Seiten-URL, Referrer, Kampagnenparameter, Geraeteinformationen und Shop-Ereignisse an Google uebermittelt werden."
consentCyroAnalyticsProvider = "Google Ireland Limited"
consentCyroAnalyticsLifespan = "Bis zu 2 Jahre / entsprechend der Google-Einstellungen"
consentCyroAnalyticsPolicyUrl = "https://policies.google.com/privacy"

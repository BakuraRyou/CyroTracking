consentCyroMatomoDescription = "Erlaubt Statistik-Tracking mit Matomo fuer Seitenaufrufe, Produktereignisse, Warenkorb, Checkout, Suche und Kaeufe. Cookies: _pk_id, _pk_ses, _pk_ref, _pk_cvar sowie ggf. Matomo-Consent-Cookies. Kampagnenparameter koennen zur Besuchs- und Conversion-Zuordnung verarbeitet werden."
consentCyroMatomoProvider = "Cyroline"
consentCyroMatomoLifespan = "Bis zu 13 Monate / entsprechend der Matomo-Einstellungen"
consentCyroMatomoPolicyUrl = "https://matomo.org/privacy-policy/"
consentCyroMarketingLabel = "Meta Pixel und Meta Conversions API"
consentCyroMarketingDescription = "Erlaubt Marketing- und Conversion-Tracking mit Meta Pixel und serverseitiger Meta Conversions API fuer Seitenaufrufe, Produkte, Warenkorb, Checkout, Suche und Kaeufe. Cookies: _fbp, _fbc. Kampagnenparameter koennen lokal bis zu 30 Minuten gespeichert werden, um Folgeereignisse derselben Sitzung zuzuordnen. Es koennen Daten wie Seiten-URL, Referrer, Kampagnenparameter, IP-Adresse, User-Agent, Event-ID, Shop-Ereignisse sowie bei Checkout und Kauf gehashte Kundenkennungen wie E-Mail-Adresse, Telefonnummer, Vorname, Nachname oder Kunden-ID an Meta uebermittelt werden."
